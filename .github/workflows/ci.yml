name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two halves of one engine:
#   - the Python reference: its tests, and the parity fixtures and engine data it writes
#     are up to date (the fixtures include replays of the recorded traces);
#   - the TypeScript port: it reproduces every fixture exactly, and typechecks;
#   - SDK conformance: the official MCP Python SDK's client and server are run and recorded, and the
#     engine must produce the same JSON-RPC messages; likewise the official A2A Python SDK's agent, driven by
#     the engine's A2A client; and every orchestration session in real, pinned LangGraph, compared checkpoint
#     for checkpoint (the job keeps its original name, a required check).
# No job calls a language model: recorded traces are replayed; sampling answers are scripted.

jobs:
  python:
    name: Python reference (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Tests (tokenizer, tools, parsing, accounting, every policy, trace replays)
        run: pytest
      - name: Fixtures and engine data are up to date
        run: python scripts/make_fixtures.py --check

  conformance:
    name: MCP SDK conformance (live recording)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,conformance]"
      - name: Record the official SDK's client and server; compare with the committed recording and the engine
        run: python scripts/record_sdk.py --check
      - name: Record the official A2A SDK's agent driven by the engine's client; compare with the committed recording and the engine
        run: python scripts/record_a2a_sdk.py --check
      - name: Run every orchestration session in the pinned LangGraph; compare every checkpoint with the committed recording and the engine
        run: python scripts/record_langgraph.py --check
      - name: Protocol tests
        run: pytest tests/test_protocols.py tests/test_a2a.py

  typescript:
    name: TypeScript port (exact parity)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Parity with the Python fixtures (no tolerance)
        run: pnpm test
